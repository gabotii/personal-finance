# Production-like stack: PostgreSQL + FastAPI + nginx serving the SPA.
#   cp .env.example .env && docker compose up -d --build   ->  http://localhost:8080
name: personal-finance

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-CLP}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Santiago}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # The backend port is only reachable through nginx and localhost.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      # API docs at http://localhost:8000/docs (bound to localhost only).
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
