# Development override: hot reload for backend (uvicorn --reload) and frontend (Vite HMR).
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   -> http://localhost:5173 (Vite proxies /api to the backend)
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "5173:5173"
    healthcheck:
      disable: true
