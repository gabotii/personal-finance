# Serves the SPA and reverse-proxies the API, so browser and API share one origin
# (the HttpOnly session cookie needs no CORS in production).

# Docker embedded DNS; re-resolve the backend if its container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the original scheme when a TLS-terminating proxy sits in front of nginx.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

  set $backend_upstream http://backend:8000;

  # nginx is the edge: X-Forwarded-For is overwritten (never appended) with the real client
  # address, so clients cannot spoof their IP to evade the API's login rate limiting.
  # If you add a TLS proxy in front, configure it to do the same and trust only it.

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 60s;
  }

  # CSV exports are streamed by the API: pass chunks through as they arrive.
  location /api/v1/export/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;
  }

  location = /health {
    proxy_pass $backend_upstream;
    proxy_set_header Host $http_host;
    access_log off;
  }

  # Liveness of this container alone (used by its HEALTHCHECK).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Fingerprinted build output: cache forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA routes: always revalidate index.html so new deployments are picked up.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
