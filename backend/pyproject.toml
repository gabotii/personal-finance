[project]
name = "personal-finance-backend"
version = "1.0.0"
description = "API de finanzas personales (FastAPI + SQLAlchemy + PostgreSQL)"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "app/db/migrations/versions"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "DTZ",      # timezone-aware datetimes
    "PTH",      # pathlib
]
ignore = [
    "B008",     # FastAPI's Depends()/Query() in defaults is idiomatic
    "RUF001",   # Spanish strings legitimately contain non-ASCII characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "DTZ"]
"app/seed.py" = ["S311"]  # deterministic demo data, not cryptography

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "error::DeprecationWarning:app.*",
    # SQLite stores NUMERIC as REAL; production (PostgreSQL) has exact decimals.
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
