[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
# The database URL comes from the DATABASE_URL environment variable (see env.py).

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
